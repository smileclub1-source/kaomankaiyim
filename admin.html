<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>หลังบ้าน | ร้านข้าวมันไก่อมยิ้ม</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{ --bg:#FDFBF7; --paper:#fff; --ink:#2C3539; --soft:#7A8B99; --gold:#C5A059; --gold-dark:#9B7B3E; --ok:#6E8B4A; --off:#E26D5C; --line:#EAE5DB; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; padding:24px 16px 64px; }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--soft); font-size:13px; margin:0 0 20px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; }
  input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font:inherit; font-size:15px; margin-bottom:10px; }
  input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(197,160,89,.15); }
  button{ font:inherit; cursor:pointer; }
  .primary{ width:100%; background:var(--gold); color:#fff; border:0; border-radius:8px; padding:13px; font-weight:600; }
  .msg{ font-size:13px; min-height:20px; margin-top:8px; color:var(--off); }
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:var(--soft); }
  .bar button{ border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:8px 12px; color:var(--ink); font-size:13px; }
  h2{ font-size:15px; margin:22px 0 8px; color:var(--gold-dark); }
  .row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .row .n{ flex:1; min-width:0; }
  .row .n b{ display:block; font-size:15px; }
  .row .n span{ font-size:12px; color:var(--soft); }
  .row.closed .n b{ color:var(--soft); text-decoration:line-through; }
  .sw{ position:relative; width:64px; height:34px; border-radius:17px; border:0; background:var(--ok); color:#fff; font-size:12px; font-weight:600; flex-shrink:0; transition:background .2s; }
  .row.closed .sw{ background:var(--off); }
  .sw:disabled{ opacity:.5; cursor:wait; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>หลังบ้าน · ร้านข้าวมันไก่อมยิ้ม</h1>
  <p class="sub">เปิด/ปิดเมนู ลูกค้าจะเห็นผลภายใน 1 นาที</p>

  <div class="card" id="login">
    <input type="password" id="pin" placeholder="รหัสผ่านหลังบ้าน" autocomplete="current-password">
    <button class="primary" id="login-btn">เข้าสู่ระบบ</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="panel" hidden>
    <div class="bar">
      <span id="summary"></span>
      <span><button id="open-all">เปิดทั้งหมด</button> <button id="reload">รีเฟรช</button></span>
    </div>
    <div id="list"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="menu-data.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDtjz8oMdSEnnt6gqQAk5UQk-F12PSIFnq-0SsQaD1x5zNbD53Uyof4qoipFcpA_H4yw/exec';
const $ = id => document.getElementById(id);
let closed = [];
let pin = '';

async function post(body){
  const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  return res.json();
}

async function load(){
  const res = await fetch(SCRIPT_URL + '?action=menu');
  const data = await res.json();
  if (!Array.isArray(data.closed)) throw new Error('ยังไม่ได้เพิ่มโค้ดหลังบ้านใน Apps Script');
  closed = data.closed;
  render();
}

function render(){
  const cats = [...new Set(MENU_DATA.map(m => m.category))];
  $('list').innerHTML = cats.map(c => `<h2>${c}</h2>` + MENU_DATA.filter(m => m.category === c).map(m => {
    const off = closed.includes(m.id);
    return `<div class="row ${off ? 'closed' : ''}"><div class="n"><b>${m.name}</b><span>${m.types[0].price} บาท · ${off ? 'ปิดอยู่' : 'เปิดขายอยู่'}</span></div>
      <button class="sw" data-id="${m.id}" aria-label="${off ? 'เปิดเมนู' : 'ปิดเมนู'} ${m.name}">${off ? 'ปิด' : 'เปิด'}</button></div>`;
  }).join('')).join('');
  $('summary').textContent = `ปิดอยู่ ${closed.length} จาก ${MENU_DATA.length} เมนู`;
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => toggle(b.dataset.id, b)));
}

async function save(next, btn){
  $('msg').textContent = '';
  if (btn) btn.disabled = true;
  try{
    const r = await post({ action:'setClosed', pin, closed: next });
    if (!r.success) throw new Error(r.error === 'pin' ? 'รหัสผ่านไม่ถูกต้อง' : 'บันทึกไม่สำเร็จ');
    closed = next;
  }catch(e){
    $('msg').textContent = e.message || 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
  }
  render();
}

function toggle(id, btn){
  save(closed.includes(id) ? closed.filter(x => x !== id) : [...closed, id], btn);
}

$('open-all').addEventListener('click', () => save([], null));
$('reload').addEventListener('click', () => load().catch(e => { $('msg').textContent = e.message; }));

$('login-btn').addEventListener('click', async () => {
  pin = $('pin').value.trim();
  if (!pin) return;
  $('login-msg').textContent = 'กำลังตรวจสอบ...';
  try{
    await load();
    // ตรวจรหัสผ่านโดยบันทึกสถานะเดิมซ้ำ (ไม่เปลี่ยนค่าใดๆ)
    const r = await post({ action:'setClosed', pin, closed });
    if (!r.success) { $('login-msg').textContent = 'รหัสผ่านไม่ถูกต้อง'; return; }
    $('login').hidden = true;
    $('panel').hidden = false;
  }catch(e){
    $('login-msg').textContent = e.message || 'เชื่อมต่อไม่ได้';
  }
});
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
</script>
</body>
</html>
